name: Build OpenWrt 25.12.6 x86_64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses-dev libz-dev patch python3 python3-pip rsync subversion unzip \
            zlib1g-dev libssl-dev file curl wget flex bison gcc-multilib g++-multilib \
            pkg-config autoconf automake libtool

      - name: Clone OpenWrt 25.12.6 source
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git -b v25.12.6 openwrt
          echo "Cloned OpenWrt v25.12.6"

      - name: Load feeds.conf
        run: |
          cp "${{ github.workspace }}/feeds.conf.default" openwrt/feeds.conf.default
          cat openwrt/feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load .config
        run: |
          cd openwrt
          cp "${{ github.workspace }}/config.seed" .config
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download V=s

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-25.12.6-x86-64
          path: openwrt/bin/targets/*/*/
          if-no-files-found: error
